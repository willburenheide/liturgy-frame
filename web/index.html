<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Liturgy Frame</title>
  <link rel="stylesheet" href="liturgy-card.css">
  <style>
    :root { --demo-bg: #E8E2D5; --demo-ink: #111; --demo-mute: #6E6A61; }
    @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --demo-bg: #0F0E0C; --demo-ink: #F2EEE6; --demo-mute: #A39D90; } }
    :root[data-theme="dark"] { --demo-bg: #0F0E0C; --demo-ink: #F2EEE6; --demo-mute: #A39D90; }
    body { margin: 0; min-height: 100vh; background: var(--demo-bg); color: var(--demo-ink); font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
    main { max-width: 760px; margin: 0 auto; padding: 40px 16px; }
    h1 { font: 400 44px Georgia, serif; margin: 0 0 6px; }
    p { color: var(--demo-mute); font-size: 17px; line-height: 1.5; margin: 0 0 28px; }
    code { font-size: 15px; }
  </style>
</head>
<body>
  <main>
    <h1 id="today"></h1>
    <p>This is the demo page for <code>liturgy-card.js</code>. Tap the card for the Saint of the Day and the Gospel.</p>
    <div id="liturgy"></div>
  </main>
  <script src="liturgy-card.js"></script>
  <script>
    var d = new Date();
    document.getElementById('today').textContent = d.toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' });
    // Same origin as the Worker by default. From another page: { api: 'https://your-worker.workers.dev' }
    var api = new URLSearchParams(location.search).get('api') || '';
    LiturgyCard.mount(document.getElementById('liturgy'), { api: api });
  </script>
</body>
</html>
